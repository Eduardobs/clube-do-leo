<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel de produtos - Clube do Léo</title>
  <link rel="icon" href="assets/brand/header-logo-medallion.png">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="admin-header">
    <div class="container admin-header__inner">
      <a href="index.html" class="brand">
        <img src="assets/brand/header-logo-medallion.png" alt="Clube do Léo" class="brand__logo">
      </a>
      <h1 class="admin-header__title">Painel de produtos</h1>
      <a href="index.html" class="btn btn--ghost btn--small"><i class="fa-solid fa-arrow-left"></i> Voltar à loja</a>
    </div>
  </header>

  <main class="container admin-main">
    <div class="admin-toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="admin-search" placeholder="Buscar por nome ou código...">
      </div>
      <div class="admin-toolbar__actions">
        <button type="button" id="import-btn" class="btn btn--ghost">
          <i class="fa-solid fa-file-import"></i> Importar JSON
        </button>
        <input type="file" id="import-file-input" accept="application/json" class="hidden">
        <button type="button" id="export-btn" class="btn btn--ghost">
          <i class="fa-solid fa-download"></i> Baixar products.json
        </button>
        <button type="button" id="new-product-btn" class="btn btn--primary">
          <i class="fa-solid fa-plus"></i> Novo produto
        </button>
      </div>
    </div>

    <div id="loading-spinner" class="spinner"></div>
    <p id="error-message" class="error-message hidden"></p>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Imagem</th>
            <th>Código</th>
            <th>Nome</th>
            <th>Categorias</th>
            <th>Valor</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="product-table-body"></tbody>
      </table>
      <p id="empty-state" class="empty-state hidden">Nenhum produto encontrado.</p>
    </div>
  </main>

  <div id="product-modal" class="modal hidden">
    <div class="modal__overlay" data-close></div>
    <div class="modal__content modal__content--admin-form">
      <button type="button" class="modal__close" data-close aria-label="Fechar">&times;</button>
      <h2 id="product-modal-title">Novo produto</h2>
      <p id="form-error" class="error-message hidden"></p>
      <form id="product-form">
        <div class="form-group">
          <label for="field-codigo">Código</label>
          <input type="text" id="field-codigo" placeholder="Ex: LEM-014" required>
        </div>
        <div class="form-group">
          <label for="field-nome">Nome</label>
          <input type="text" id="field-nome" placeholder="Nome do produto" required>
        </div>
        <div class="form-group">
          <label for="field-descricao">Descrição</label>
          <textarea id="field-descricao" placeholder="Descrição, tamanho, conteúdo..."></textarea>
        </div>
        <div class="form-group">
          <label for="field-valor">Valor (R$)</label>
          <input type="number" id="field-valor" min="0" step="0.01" placeholder="0,00">
          <small class="form-hint">Deixe 0 para exibir "Sob consulta".</small>
        </div>
        <div class="form-group">
          <label>Categorias</label>
          <div id="categoria-checkboxes" class="checkbox-group"></div>
        </div>
        <div class="form-group">
          <label>Imagens</label>
          <div id="image-list"></div>
          <button type="button" id="add-image-btn" class="btn btn--ghost btn--small">
            <i class="fa-solid fa-plus"></i> Adicionar imagem
          </button>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
          <button type="submit" class="btn btn--primary">Salvar produto</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="src/config/store.js"></script>
  <script src="src/shared/utils.js"></script>
  <script src="src/features/admin/admin.js"></script>
</body>
</html>
