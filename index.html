<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube do Léo - Lembrancinhas, festas e presentes personalizados</title>
  <meta name="description" content="Lembrancinhas, itens de festa e presentes personalizados. Faça seu pedido e finalize direto pelo WhatsApp.">
  <link rel="icon" href="assets/logo_sem_descricao.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="#top" class="brand">
        <img src="assets/logo.png" alt="Clube do Léo" class="brand__logo">
      </a>
      <nav class="site-nav">
        <a href="#produtos" class="site-nav__catalog"><span>Produtos</span></a>
        <a href="https://www.instagram.com/clubedoleo_/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://wa.me/5551998450386" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
      </nav>
      <button type="button" id="cart-btn" class="cart-btn" aria-label="Abrir carrinho">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="cart-btn__badge">0</span>
      </button>
    </div>
  </header>

  <main>
    <section id="produtos" class="catalog container">
      <div class="catalog__controls">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" id="search-input" placeholder="Buscar produto...">
        </div>
        <div id="category-filters" class="filter-pills"></div>
      </div>

      <div id="loading-spinner" class="spinner"></div>
      <p id="error-message" class="error-message hidden"></p>
      <div id="product-list" class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer__inner">
      <img src="assets/logo-gray.png" alt="Clube do Léo" class="footer__logo">
      <div class="footer__social">
        <a href="https://www.instagram.com/clubedoleo_/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://wa.me/5551998450386" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
      </div>
      <p class="footer__copy">&copy; <span id="year"></span> Clube do Léo. Todos os direitos reservados.</p>
      <a href="admin.html" class="footer__admin-link">Painel administrativo</a>
    </div>
  </footer>

  <div id="product-detail-modal" class="modal hidden">
    <div class="modal__overlay" data-close></div>
    <div class="modal__content">
      <button type="button" class="modal__close" data-close aria-label="Fechar">&times;</button>
      <div id="product-detail"></div>
    </div>
  </div>

  <div id="cart-modal" class="modal hidden">
    <div class="modal__overlay" data-close></div>
    <div class="modal__content modal__content--cart">
      <button type="button" class="modal__close" data-close aria-label="Fechar">&times;</button>
      <h2><i class="fa-solid fa-cart-shopping"></i> Carrinho de compras</h2>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-footer">
        <button type="button" id="clear-cart-btn" class="btn btn--ghost"><i class="fa-solid fa-trash"></i> Limpar</button>
        <p class="cart-total">Total: <strong id="cart-total">R$ 0,00</strong></p>
        <button type="button" id="finalize-btn" class="btn btn--primary"><i class="fa-solid fa-check"></i> Finalizar compra</button>
      </div>
    </div>
  </div>

  <div id="checkout-modal" class="modal hidden">
    <div class="modal__overlay" data-close></div>
    <div class="modal__content">
      <button type="button" class="modal__close" data-close aria-label="Fechar">&times;</button>
      <h2>Finalizar compra</h2>
      <form id="checkout-form">
        <label for="customer-name">Seu nome</label>
        <input type="text" id="customer-name" placeholder="Digite seu nome" required minlength="2">
        <button type="submit" class="btn btn--primary btn--block"><i class="fa-brands fa-whatsapp"></i> Enviar pedido pelo WhatsApp</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
